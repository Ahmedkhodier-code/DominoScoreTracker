name: KMP iOS Remote Stream

on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install cloudflared
        run: |
          brew install cloudflare/cloudflare/cloudflared

      - name: Boot iOS Simulator
        run: |
          UDID=$(xcrun simctl list devices available "iPhone 17" | grep -oE '[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}' | head -n 1)
          if [ -z "$UDID" ]; then
            UDID=$(xcrun simctl list devices available "iPhone" | grep -oE '[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}' | head -n 1)
          fi
          echo "Booting device: $UDID"
          xcrun simctl boot "$UDID" || true
          open -a Simulator

      - name: Build and Install iOS App
        run: |
          chmod +x gradlew
          echo "Building KMP shared modules first..."
          ./gradlew :sharedLogic:linkDebugFrameworkIosSimulatorArm64 --info
          
          echo "Building Xcode project..."
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp -sdk iphonesimulator -destination 'platform=iOS Simulator,name=iPhone 17' build
          
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "*.app" -type d | grep "Debug-iphonesimulator" | head -n 1)
          echo "App path: $APP_PATH"
          if [ -z "$APP_PATH" ]; then
            echo "Error: App path not found!"
            exit 1
          fi
          
          UDID=$(xcrun simctl list devices booted | grep -oE '[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}' | head -n 1)
          xcrun simctl install "$UDID" "$APP_PATH"
          
          BUNDLE_ID=$(defaults read "$APP_PATH/Info" CFBundleIdentifier 2>/dev/null || echo "com.khodier.dominoscoretracker.iosApp")
          echo "Launching Bundle ID: $BUNDLE_ID"
          xcrun simctl launch "$UDID" "$BUNDLE_ID"

      - name: Start Live Simulator Stream & Cloudflare Tunnel
        run: |
          cat << 'EOF' > /tmp/stream_server.py
          import http.server
          import subprocess
          import time

          class StreamHandler(http.server.BaseHTTPRequestHandler):
              def do_GET(self):
                  self.send_response(200)
                  self.send_header('Content-type', 'multipart/x-mixed-replace; boundary=frame')
                  self.end_headers()
                  while True:
                      try:
                          subprocess.run(['xcrun', 'simctl', 'io', 'booted', 'screenshot', '/tmp/sim_screen.png'], check=True, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
                          with open('/tmp/sim_screen.png', 'rb') as f:
                              frame = f.read()
                          self.wfile.write(b'--frame\r\n')
                          self.wfile.write(b'Content-Type: image/png\r\n')
                          self.wfile.write(f'Content-Length: {len(frame)}\r\n\r\n'.encode())
                          self.wfile.write(frame)
                          self.wfile.write(b'\r\n')
                          time.sleep(0.5)
                      except Exception:
                          break

          server = http.server.HTTPServer(('localhost', 8080), StreamHandler)
          print("Streaming server started on port 8080")
          server.serve_forever()
          EOF

          python3 /tmp/stream_server.py &

          echo "Starting Cloudflare tunnel..."
          cloudflared tunnel --url http://localhost:8080 &

          echo "========================================================"
          echo "Live Simulator Stream is active! Open the .trycloudflare.com URL above."
          echo "========================================================"

          sleep 3600
