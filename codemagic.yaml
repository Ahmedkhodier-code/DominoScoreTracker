workflows:
  ios-simulator-build:
    name: iOS Simulator Build
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      groups: []
      vars:
        XCODE_WORKSPACE: "iosApp/iosApp.xcodeproj"
        XCODE_SCHEME: "iosApp"
      xcode: latest
    scripts:
      - name: Build shared Kotlin framework for iOS Simulator
        script: |
          ./gradlew :sharedUI:embedAndSignAppleFrameworkForXcode \
            -Pkotlin.native.cocoapods.platform=iphonesimulator \
            -PXCODE_SDK_NAME=iphonesimulator \
            -PXCODE_CONFIGURATION=Debug \
            -PXCODE_TARGET_BUILD_DIR=build \
            -PXCODE_BUILT_PRODUCTS_DIR=build \
            -PXCODE_FRAMEWORKS_FOLDER_PATH=Frameworks \
            -PTARGET_BUILD_DIR=build \
            -PCONFIGURATION=Debug \
            -PSDK_NAME=iphonesimulator \
            -PARCHS=arm64 \
            -PFRAMEWORKS_FOLDER_PATH=Frameworks
      - name: Build iOS app for Simulator
        script: |
          cd iosApp
          xcodebuild build \
            -project iosApp.xcodeproj \
            -scheme "$XCODE_SCHEME" \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
    artifacts:
      - build/**/*.log
