workflows:
  ios-simulator-build:
    name: iOS Simulator Build
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      groups: []
      vars:
        XCODE_WORKSPACE: "iosApp/iosApp.xcodeproj"
        XCODE_SCHEME: "iosApp"
      xcode: latest
    scripts:
      - name: Set gradlew permissions
        script: |
          chmod +x ./gradlew
      - name: Build Kotlin framework via Gradle
        script: |
          ./gradlew :sharedUI:assemble
      - name: Build iOS app for Simulator
        script: |
          cd iosApp
          xcodebuild build \
            -project iosApp.xcodeproj \
            -scheme "$XCODE_SCHEME" \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO || xcodebuild build \
            -project iosApp.xcodeproj \
            -scheme "$XCODE_SCHEME" \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
    artifacts:
      - build/**/*.log
      - iosApp/**/*.app
      - ~/Library/Developer/Xcode/DerivedData/**/*.app
